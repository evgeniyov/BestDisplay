name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Unit tests
        run: ./Scripts/test.sh
      - name: Build (ad hoc signed)
        run: ./Scripts/build.sh
      - name: Check bundle
        run: |
          test -f build/BestDisplay.app/Contents/Resources/AppIcon.icns
          plutil -lint build/BestDisplay.app/Contents/Info.plist
